name: Windows (MSYS2)

# Native Windows build of the host tree via mingw-w64.
#
# The host links libagenthttpd.a, and agent-httpd has no Windows support (its
# 30 .c files are POSIX socket code with zero _WIN32 guards). The Windows build
# therefore leaves the library out and swaps in stubs — see the $(IS_WINDOWS)
# branch in the Makefile and the header comments in lang/bridge_stub.c:
#
#   - bridge.c        -> bridge_stub.c   (route/tool registered, run() errors out)
#   - iquest.c        -> excluded        (agenthttpd_route + minijson reader)
#   - builtins_sql.c  -> builtins_stub.c (SQLite lives in libagenthttpd.a)
#   - builtins_http.c -> builtins_stub.c (bare sockets; LUME_HAS_HTTP=0)
#   - --watch         -> off             (no fork/pipe; lang/main.c guards it)
#
# What this workflow verifies is therefore exactly what the port promises: the
# interpreter, the type checker, and module loading run on Windows and produce
# bin/lume.exe. Serving HTTP is out of scope by design.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: this workflow only compiles and reads tracked fixtures.
permissions:
  contents: read

# A new push on the same ref supersedes the previous run;
# keep the long build/test matrices from queuing up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain

      - name: Build
        run: make

      - name: Check (parse + type check every example)
        # `make check` = crypt-test + a --check pass over every example.
        # Checking never executes run(), so the server-side demos type-check
        # fine even though serving is compiled out — which is the point: it
        # proves the whole language surface (route/tool/run declarations
        # included) still type-checks on Windows.
        run: make check

      - name: Run lang-basics
        # hello.lume grew into the full HTTP-server demo and ends in run(),
        # which the Windows build deliberately rejects (no libagenthttpd —
        # the stub bridge errors out). lang-basics.lume is a pure script
        # (compute + print, no server, no http_/sql_ builtins), so it proves
        # the interpreter actually executes on Windows without pretending
        # the server story exists there.
        run: ./bin/lume.exe examples/lang-basics.lume

      - name: Cross-repo semantic baselines
        # lume has no native backend/emitter, so lume-core's three-backend
        # native-consistency fixtures do not apply here (see
        # tests/baseline.provenance). These two scripts ARE verbatim copies
        # of two core fixtures, and their .expected files were produced by
        # the core interpreter. Byte-comparing bin/lume.exe's output proves
        # the Windows interpreter agrees with Linux core on literals, bit
        # ops and block scope — a real regression leg, not just the one
        # lang-basics smoke. tr -d '\r' on BOTH sides neutralises MSVCRT
        # text-mode CRLF and a checkout that converted .expected to CRLF.
        run: |
          set -e
          out=$(mktemp)
          exp=$(mktemp)
          for base in baseline-literals-bitops baseline-block-scope; do
            ./bin/lume.exe "tests/$base.lume" | tr -d '\r' > "$out"
            tr -d '\r' < "tests/$base.expected" > "$exp"
            diff -u "$exp" "$out"
            echo "ok   $base: Windows output matches lume-core"
          done
          rm -f "$out" "$exp"

      # `make test` is POSIX-only (it drives a live HTTP server through
      # libagenthttpd, and its harness uses POSIX mkdir(2)/rm shell calls).
      # It runs on the Linux `ci` job instead.