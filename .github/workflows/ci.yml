name: CI

on:
  push:
    branches: [main]
  pull_request:

# agent-httpd 是 lume 的 git submodule(见 .gitmodules),版本由 gitlink 锁定;
# checkout 带 submodules: recursive 自动按 gitlink 拉取,无需手动 checkout。
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lume
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        run: npm install -g pnpm@9.15.9
      - name: Build + full test suite
        working-directory: lume
        run: |
          make -j4 test
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: lume/logs/
        continue-on-error: true

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lume
          submodules: recursive
      - name: Build + run ASan/UBSan checks
        working-directory: lume
        run: |
          make -j4 asan
