name: CI

on:
  push:
    branches: [main]
  pull_request:

# agent-httpd 是 lume 的 git submodule(见 .gitmodules),版本由 gitlink 锁定;
# checkout 带 submodules: recursive 自动按 gitlink 拉取,无需手动 checkout。
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: lume
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm@9.15.9
      - name: Build + full test suite
        working-directory: lume
        run: |
          make -j4 test
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: lume/logs/
        continue-on-error: true

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: lume
          submodules: recursive
      - name: Build + run ASan/UBSan checks
        working-directory: lume
        run: |
          make -j4 asan

  # The pin in lang/PIN says which lume-core commit lang/ was copied from.
  # Full drift detection needs a lume-core checkout, which the runner does not
  # have (and erishen/lume-core is an empty repo, so there is nothing to
  # clone); check-sync therefore always verifies the committed md5 baseline in
  # lang/PIN.manifest.  That is the leg that fails here - a synced file
  # edited by hand without a `make sync-lang` bump.  When lume-core is
  # published and this tree gets cloned as a sibling, check-sync silently
  # upgrades to comparing against the pinned commit too.
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: lume
          submodules: recursive
      - name: Verify the pin
        working-directory: lume
        run: |
          make check-sync
