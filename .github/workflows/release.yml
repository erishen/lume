name: Release

# 发布工作流: push 一个 v* tag(如 v0.2.0)时,在四个平台原生构建 bin/lume,
# 以 lume-<os>-<arch> 命名,附加到该 tag 的 GitHub Release(不存在则创建)。
# install.sh 用同样的命名约定从 releases/latest/download/ 下载,所以新增
# 平台只需要改这里的矩阵 + install.sh 的平台映射。
#
# push main / PR 也会跑同一个构建矩阵(不上传 asset),让平台构建问题在
# 发布前就暴露,而不是等到打 tag 才第一次编译。
#
# 注意: 矩阵并发往同一个 release 上传 asset。action-gh-release 先按 tag
# 查已有 release(不存在才创建),多 job 并行是安全用法;fail-fast: false
# 保证单平台失败不影响其它平台产物。tag 之外的事件 GITHUB_TOKEN 只读,
# 上传步骤全部有 if 守卫。

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: lume-linux-x64
          - os: ubuntu-24.04-arm
            asset: lume-linux-arm64
          - os: macos-14
            asset: lume-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libcrypt-dev m4

      - name: Build lume
        run: make

      # GitHub now runs Node-20-targeting actions on the Node-24 runtime, so
      # the frontend build is explicitly pinned to Node 24 everywhere.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend deps
        run: |
          corepack enable
          cd frontend && pnpm install --frozen-lockfile

      - name: Build frontend bundle
        run: make ui

      # The React SSR demo needs its resident node backend and hydration
      # bundle in the tarball, otherwise a released lume serves /react from
      # the static fallback only. Sources live in frontend/react-ssr/ (built
      # by scripts/build-react-ssr.sh -> bin/react-ssr-server +
      # www/js/react-ssr.js). Platform-independent JS, so one build serves
      # all four tarballs.
      - name: Build React SSR backend
        run: |
          cd frontend/react-ssr && pnpm install --frozen-lockfile
          cd ../..
          sh scripts/build-react-ssr.sh

      - name: Smoke-check all examples
        run: make check

      - name: Report platform and binary type
        run: uname -s -m && file bin/lume

      # 静态二进制(容器/scratch 用):与 docker/Dockerfile 同一串 -static 编法,
      # 编到独立文件名 bin/lume-static, 不覆盖上面的动态 bin/lume(动态版仍进
      # 普通 tarball)。零动态依赖 => 可直接 COPY 进 FROM scratch / alpine, 无需
      # glibc/libsqlite3 运行时。仅 Linux 产(静态 glibc);macOS 走动态 dylib。
      # 非 tag 事件也跑, 让静态编回归在发布前暴露(同普通 Build lume 的意图)。
      - name: Build static lume (container/scratch)
        if: runner.os == 'Linux'
        run: |
          rm -rf build agent-httpd/bin agent-httpd/build
          make all TARGET=bin/lume-static \
            CFLAGS_EXTRA="-D_GNU_SOURCE -DHAVE_CRYPT -DHAVE_CRYPT_H -ffunction-sections -fdata-sections -Wno-format-truncation -Wno-stringop-truncation" \
            LDFLAGS_EXTRA="-lcrypt -lm -static -Wl,--gc-sections"
          echo "==> static binary type:"; file bin/lume-static
          # 静态二进制必须零动态依赖, 否则 scratch 镜像里 SQLite/启动会崩
          if ldd bin/lume-static 2>&1 | grep -q "not a dynamic executable"; then
            echo "==> confirmed: fully static (no glibc/libsqlite3 runtime dep)"
          else
            echo "static build leaked dynamic deps:"; ldd bin/lume-static; exit 1
          fi
          ./bin/lume-static --check examples/hub.lume

      # The release asset is a tarball, not a bare binary: the web UI bundles
      # (www/*.js) are gitignored build output, so the frontend must ride
      # inside the artifact or an installed binary would serve broken
      # /chat /dsl pages (docroot resolves ./www from the working directory).
      - name: Stage release tarball
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p "dist/${{ matrix.asset }}/bin"
          cp bin/lume "dist/${{ matrix.asset }}/bin/"
          cp bin/react-ssr-server "dist/${{ matrix.asset }}/bin/"
          cp -r www examples docs README.md README.zh.md CHANGELOG.md install.sh "dist/${{ matrix.asset }}/"
          cd dist
          tar -czf "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.sha256"
          fi

      # 静态版 tarball:仅含 bin/lume(静态) + install.sh(供 LUME_STATIC=1 拉取),
      # 不含 www/examples(那些随宿主项目走, 容器里不需要)。命名 <asset>-static。
      - name: Stage static release tarball
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux'
        run: |
          mkdir -p "dist/${{ matrix.asset }}-static/bin"
          cp bin/lume-static "dist/${{ matrix.asset }}-static/bin/lume"
          cp install.sh "dist/${{ matrix.asset }}-static/"
          cd dist
          tar -czf "${{ matrix.asset }}-static.tar.gz" "${{ matrix.asset }}-static"
          sha256sum "${{ matrix.asset }}-static.tar.gz" > "${{ matrix.asset }}-static.sha256"

      # darwin: rebuild x86_64 via clang cross-compilation and stage a
      # second tarball. The arm64 runner's /opt/homebrew openssl is the
      # wrong slice for an x86_64 link, so the step below installs the
      # x86_64 openssl via Rosetta Homebrew and points OPENSSL_PREFIX at it.
      - name: Install x86_64 OpenSSL for darwin-x64 cross-build
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        run: |
          if [ -x /usr/local/bin/brew ]; then
            arch -x86_64 /usr/local/bin/brew install openssl@4
            echo "OPENSSL_X64_PREFIX=/usr/local/opt/openssl@4" >> "$GITHUB_ENV"
          else
            echo "OPENSSL_X64_PREFIX=" >> "$GITHUB_ENV"
          fi

      - name: Cross-build darwin-x64 and stage tarball
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        run: |
          make clean
          make -C agent-httpd clean
          make -C agent-httpd CC="clang -target x86_64-apple-darwin" OPENSSL_PREFIX="$OPENSSL_X64_PREFIX" bin/libagenthttpd.a
          make CC="clang -target x86_64-apple-darwin" OPENSSL_PREFIX="$OPENSSL_X64_PREFIX" bin/lume
          file bin/lume
          # agent-httpd clean wiped its bin/: rebuild the resident backend
          # (node bundle, arch-independent) before staging.
          sh scripts/build-react-ssr.sh >/dev/null
          mkdir -p "dist/lume-darwin-x64/bin"
          cp bin/lume "dist/lume-darwin-x64/bin/"
          cp bin/react-ssr-server "dist/lume-darwin-x64/bin/"
          cp -r www examples docs README.md README.zh.md CHANGELOG.md install.sh "dist/lume-darwin-x64/"
          cd dist
          tar -czf lume-darwin-x64.tar.gz lume-darwin-x64
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum lume-darwin-x64.tar.gz > lume-darwin-x64.sha256
          else
            shasum -a 256 lume-darwin-x64.tar.gz > lume-darwin-x64.sha256
          fi
          cd ..

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux'
        with:
          name: ${{ matrix.asset }}-static
          path: dist/${{ matrix.asset }}-static.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        with:
          name: lume-darwin-x64
          path: dist/lume-darwin-x64.*
          if-no-files-found: error

      # softprops/action-gh-release@v2 silently matches no files under the
      # forced Node-24 runtime (its files glob stops resolving relative to the
      # workspace), so assets are attached with the runner's own gh CLI.
      - name: Attach release assets (${{ matrix.asset }})
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" \
            "dist/${{ matrix.asset }}.tar.gz" "dist/${{ matrix.asset }}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Attach static release assets (${{ matrix.asset }}-static)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "dist/${{ matrix.asset }}-static.tar.gz" "dist/${{ matrix.asset }}-static.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Attach cross-built darwin-x64 assets
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/lume-darwin-x64.tar.gz dist/lume-darwin-x64.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
