name: Release

# 发布工作流: push 一个 v* tag(如 v0.2.0)时,在四个平台原生构建 bin/lume,
# 以 lume-<os>-<arch> 命名,附加到该 tag 的 GitHub Release(不存在则创建)。
# install.sh 用同样的命名约定从 releases/latest/download/ 下载,所以新增
# 平台只需要改这里的矩阵 + install.sh 的平台映射。
#
# push main / PR 也会跑同一个构建矩阵(不上传 asset),让平台构建问题在
# 发布前就暴露,而不是等到打 tag 才第一次编译。
#
# 注意: 矩阵并发往同一个 release 上传 asset。action-gh-release 先按 tag
# 查已有 release(不存在才创建),多 job 并行是安全用法;fail-fast: false
# 保证单平台失败不影响其它平台产物。tag 之外的事件 GITHUB_TOKEN 只读,
# 上传步骤全部有 if 守卫。

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

# Never cancel a tagged release mid-upload: a half-attached
# asset set is worse than a queued build. Still grouped per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Release-time sync gate. The build matrix below only compiles and stages;
  # without this, a tag cut from a tree whose lang/ drifted from lume-core,
  # or whose semantic baseline fixtures went stale, would still publish.
  # ci.yml also gates v* tags now, but release.yml must be able to refuse on
  # its own: a re-run / manually dispatched release must not skip the pin.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          path: lume
          submodules: recursive
      # check --strict resolves lang/PIN's sha with git rev-parse, and the
      # drift leg walks lume-core history, so a shallow checkout would turn
      # a healthy folded pin into a false STALEPIN.
      - name: Checkout lume-core as a sibling (real drift detection)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          repository: erishen/lume-core
          path: lume-core
          fetch-depth: 0
      - name: "Verify the pin (strict: drift, stale PIN, new lag, registry gaps)"
        working-directory: lume
        run: make check-sync
      - name: "Verify builtin parity against lume-core"
        working-directory: lume
        run: make check-parity
      - name: "Verify cross-repo semantic baseline is in sync"
        working-directory: lume
        run: |
          set -e
          cmp -s tests/baseline-literals-bitops.lume \
                 ../lume-core/tests/literals-bitops-consistency.lume || {
            echo "baseline-literals-bitops.lume drifted from lume-core";
            diff -u ../lume-core/tests/literals-bitops-consistency.lume \
                    tests/baseline-literals-bitops.lume | head -40; exit 1; }
          cmp -s tests/baseline-block-scope.lume \
                 ../lume-core/tests/p1-9-consistency.lume || {
            echo "baseline-block-scope.lume drifted from lume-core";
            diff -u ../lume-core/tests/p1-9-consistency.lume \
                    tests/baseline-block-scope.lume | head -40; exit 1; }
          echo "semantic baseline fixtures match lume-core"
      # Makefile's LUME_VERSION is the single source for `lume --version`.
      # Publishing vX.Y.Z while the binary still reports another version is
      # exactly the mismatch install.sh / support cannot detect after the fact.
      - name: "Assert release tag matches LUME_VERSION"
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: lume
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          declared=$(sed -n 's/^LUME_VERSION[[:space:]]*?=[[:space:]]*//p' Makefile | head -1 | tr -d '[:space:]')
          echo "tag=$tag Makefile LUME_VERSION=$declared"
          [ -n "$declared" ] || { echo "could not read LUME_VERSION from Makefile"; exit 1; }
          [ "$tag" = "$declared" ] || {
            echo "release tag $GITHUB_REF_NAME does not match LUME_VERSION $declared";
            echo "bump LUME_VERSION in Makefile before cutting the tag"; exit 1; }

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: lume-linux-x64
          - os: ubuntu-24.04-arm
            asset: lume-linux-arm64
          - os: macos-14
            asset: lume-darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          submodules: recursive

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libcrypt-dev m4 \
            libzstd-dev zlib1g-dev liblzma-dev libbrotli-dev
          # The jitterentropy dev package only exists on 26.04+ images
          # (ubuntu-latest). 24.04-arm has none at all — and its libcrypto
          # has no jitter references either, so the Makefile's probe just
          # skips the -l flag there. Install failures are non-fatal.
          sudo apt-get install -y libjitterentropy3-dev \
            || sudo apt-get install -y libjitterentropy-dev || true

      - name: Build lume
        run: make

      # GitHub now runs Node-20-targeting actions on the Node-24 runtime, so
      # the frontend build is explicitly pinned to Node 24 everywhere.
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 24

      - name: Install frontend deps
        run: |
          corepack enable
          cd frontend && pnpm install --frozen-lockfile

      - name: Build frontend bundle
        run: make ui

      # The React SSR demo needs its resident node backend and hydration
      # bundle in the tarball, otherwise a released lume serves /react from
      # the static fallback only. Sources live in frontend/react-ssr/ (built
      # by scripts/build-react-ssr.sh -> bin/react-ssr-server +
      # www/js/react-ssr.js). Platform-independent JS, so one build serves
      # all four tarballs.
      - name: Build React SSR backend
        run: |
          cd frontend/react-ssr && pnpm install --frozen-lockfile
          cd ../..
          sh scripts/build-react-ssr.sh

      - name: Smoke-check all examples
        run: make check

      - name: Report platform and binary type
        run: uname -s -m && file bin/lume

      # 静态二进制(容器/scratch 用):与 docker/Dockerfile 同一串 -static 编法,
      # 编到独立文件名 bin/lume-static, 不覆盖上面的动态 bin/lume(动态版仍进
      # 普通 tarball)。零动态依赖 => 可直接 COPY 进 FROM scratch / alpine, 无需
      # glibc/libsqlite3 运行时。仅 Linux 产(静态 glibc);macOS 走动态 dylib。
      # 非 tag 事件也跑, 让静态编回归在发布前暴露(同普通 Build lume 的意图)。
      - name: Build static lume (container/scratch)
        if: runner.os == 'Linux'
        run: |
          rm -rf build agent-httpd/bin agent-httpd/build
          # ubuntu-26.04's static libcrypto.a pulls in compression + jitter
          # entropy deps (OpenSSL 3.x built with them enabled); the 24.04
          # runner's did not, which is why v0.12.0 linked fine and v0.12.1
          # died on undefined jent_entropy_init_ex/ZSTD_*/deflateEnd.
          # The Makefile appends the actual -l flags AFTER -lcrypto when
          # it sees -static in LDFLAGS_EXTRA (static ld resolves l2r).
          make all TARGET=bin/lume-static \
            CFLAGS_EXTRA="-D_GNU_SOURCE -DHAVE_CRYPT -DHAVE_CRYPT_H -ffunction-sections -fdata-sections -Wno-format-truncation -Wno-stringop-truncation" \
            LDFLAGS_EXTRA="-lcrypt -lm -static -Wl,--gc-sections"
          echo "==> static binary type:"; file bin/lume-static
          # 静态二进制必须零动态依赖, 否则 scratch 镜像里 SQLite/启动会崩
          if ldd bin/lume-static 2>&1 | grep -q "not a dynamic executable"; then
            echo "==> confirmed: fully static (no glibc/libsqlite3 runtime dep)"
          else
            echo "static build leaked dynamic deps:"; ldd bin/lume-static; exit 1
          fi
          ./bin/lume-static --check examples/hub.lume

      # The release asset is a tarball, not a bare binary: the web UI bundles
      # (www/*.js) are gitignored build output, so the frontend must ride
      # inside the artifact or an installed binary would serve broken
      # /chat /dsl pages (docroot resolves ./www from the working directory).
      # Staging runs on every event (upload stays tag-only) so the checksum +
      # unpack verification below is exercised on main/PR, not only at release.
      - name: Stage release tarball
        run: |
          mkdir -p "dist/${{ matrix.asset }}/bin"
          cp bin/lume "dist/${{ matrix.asset }}/bin/"
          cp bin/react-ssr-server "dist/${{ matrix.asset }}/bin/"
          cp -r www examples docs README.md README.zh.md CHANGELOG.md install.sh "dist/${{ matrix.asset }}/"
          cd dist
          tar -czf "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.sha256"
          fi

      # 静态版 tarball:仅含 bin/lume(静态) + install.sh(供 LUME_STATIC=1 拉取),
      # 不含 www/examples(那些随宿主项目走, 容器里不需要)。命名 <asset>-static。
      # Staging runs on every event (upload stays tag-only) so the *-static*
      # branch of the tarball verifier below is exercised on main/PR instead
      # of only on a tagged release.
      - name: Stage static release tarball
        if: runner.os == 'Linux'
        run: |
          mkdir -p "dist/${{ matrix.asset }}-static/bin"
          cp bin/lume-static "dist/${{ matrix.asset }}-static/bin/lume"
          cp install.sh "dist/${{ matrix.asset }}-static/"
          cd dist
          tar -czf "${{ matrix.asset }}-static.tar.gz" "${{ matrix.asset }}-static"
          sha256sum "${{ matrix.asset }}-static.tar.gz" > "${{ matrix.asset }}-static.sha256"

      # darwin: rebuild x86_64 via clang cross-compilation and stage a
      # second tarball. The arm64 runner's /opt/homebrew openssl is the
      # wrong slice for an x86_64 link, so the step below installs the
      # x86_64 openssl via Rosetta Homebrew and points OPENSSL_PREFIX at it.
      - name: Install x86_64 OpenSSL for darwin-x64 cross-build
        if: runner.os == 'macOS'
        run: |
          if [ -x /usr/local/bin/brew ]; then
            # Non-fatal: a runner without a usable Rosetta Homebrew still
            # cross-builds with HAVE_OPENSSL=0 (the Makefile probes the
            # prefix), and the x64 tarball's exec smoke is skipped anyway.
            arch -x86_64 /usr/local/bin/brew install openssl@4 || true
            echo "OPENSSL_X64_PREFIX=/usr/local/opt/openssl@4" >> "$GITHUB_ENV"
          else
            echo "OPENSSL_X64_PREFIX=" >> "$GITHUB_ENV"
          fi

      # Also staged on main/PR so the *darwin-x64* branch of the verifier
      # (checksum, unpack, payload; exec smoke skipped) is a real leg rather
      # than dead code that only a tagged release ever reaches.
      - name: Cross-build darwin-x64 and stage tarball
        if: runner.os == 'macOS'
        run: |
          make clean
          make -C agent-httpd clean
          make -C agent-httpd CC="clang -target x86_64-apple-darwin" OPENSSL_PREFIX="$OPENSSL_X64_PREFIX" bin/libagenthttpd.a
          make CC="clang -target x86_64-apple-darwin" OPENSSL_PREFIX="$OPENSSL_X64_PREFIX" bin/lume
          file bin/lume
          # agent-httpd clean wiped its bin/: rebuild the resident backend
          # (node bundle, arch-independent) before staging.
          sh scripts/build-react-ssr.sh >/dev/null
          mkdir -p "dist/lume-darwin-x64/bin"
          cp bin/lume "dist/lume-darwin-x64/bin/"
          cp bin/react-ssr-server "dist/lume-darwin-x64/bin/"
          cp -r www examples docs README.md README.zh.md CHANGELOG.md install.sh "dist/lume-darwin-x64/"
          cd dist
          tar -czf lume-darwin-x64.tar.gz lume-darwin-x64
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum lume-darwin-x64.tar.gz > lume-darwin-x64.sha256
          else
            shasum -a 256 lume-darwin-x64.tar.gz > lume-darwin-x64.sha256
          fi
          cd ..

      # Verify before upload: a truncated/empty tarball, a mismatched
      # checksum or a missing payload directory must fail the build rather
      # than reach a tagged release. Runs on every event because staging
      # above now does too.
      - name: "Verify staged tarballs (checksum, unpack, binary smoke)"
        run: |
          set -e
          cd dist
          for pkg in *.tar.gz; do
            sum="${pkg%.tar.gz}.sha256"
            top_name="${pkg%.tar.gz}"
            echo "==> $pkg: checksum"
            [ -f "$sum" ] || { echo "missing checksum file $sum"; exit 1; }
            expected=$(awk 'NR==1 {print $1}' "$sum")
            if command -v sha256sum >/dev/null 2>&1; then
              actual=$(sha256sum "$pkg" | awk '{print $1}')
            else
              actual=$(shasum -a 256 "$pkg" | awk '{print $1}')
            fi
            [ -n "$expected" ] && [ "$expected" = "$actual" ] || {
              echo "checksum mismatch for $pkg: $expected != $actual"; exit 1; }

            echo "==> $pkg: unpack + payload"
            work=$(mktemp -d)
            tar -xzf "$pkg" -C "$work"
            top="$work/$top_name"
            [ -d "$top" ] || { echo "missing top-level $top_name in $pkg"; exit 1; }
            binary=""
            for cand in lume lume-core; do
              if [ -x "$top/bin/$cand" ]; then binary="$top/bin/$cand"; break; fi
            done
            [ -n "$binary" ] || { echo "no executable under $top/bin"; exit 1; }
            [ -f "$top/install.sh" ] || { echo "missing install.sh in $pkg"; exit 1; }
            case "$pkg" in
              *-static*) : ;;  # static tarball ships only bin/ + install.sh
              *) [ -d "$top/examples" ] || { echo "missing examples/ in $pkg"; exit 1; } ;;
            esac

            # darwin-x64 is cross-built on an arm64 runner; executing it
            # depends on Rosetta, so verify its bytes but skip the exec.
            case "$pkg" in
              *darwin-x64*) echo "==> $pkg: cross-built x64, exec smoke skipped" ;;
              *) echo "==> $pkg: exec smoke"; "$binary" --help >/dev/null 2>&1 || {
                   echo "binary smoke failed: $binary"; exit 1; } ;;
            esac
            rm -rf "$work"
          done

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux'
        with:
          name: ${{ matrix.asset }}-static
          path: dist/${{ matrix.asset }}-static.*
          if-no-files-found: error

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        with:
          name: lume-darwin-x64
          path: dist/lume-darwin-x64.*
          if-no-files-found: error

      # softprops/action-gh-release@v2 silently matches no files under the
      # forced Node-24 runtime (its files glob stops resolving relative to the
      # workspace), so assets are attached with the runner's own gh CLI.
      - name: Attach release assets (${{ matrix.asset }})
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" \
            "dist/${{ matrix.asset }}.tar.gz" "dist/${{ matrix.asset }}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Attach static release assets (${{ matrix.asset }}-static)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "dist/${{ matrix.asset }}-static.tar.gz" "dist/${{ matrix.asset }}-static.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Attach cross-built darwin-x64 assets
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/lume-darwin-x64.tar.gz dist/lume-darwin-x64.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
