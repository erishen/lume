name: Release

# 发布工作流: push 一个 v* tag(如 v0.2.0)时,在四个平台原生构建 bin/lume,
# 以 lume-<os>-<arch> 命名,附加到该 tag 的 GitHub Release(不存在则创建)。
# install.sh 用同样的命名约定从 releases/latest/download/ 下载,所以新增
# 平台只需要改这里的矩阵 + install.sh 的平台映射。
#
# push main / PR 也会跑同一个构建矩阵(不上传 asset),让平台构建问题在
# 发布前就暴露,而不是等到打 tag 才第一次编译。
#
# 注意: 矩阵并发往同一个 release 上传 asset。action-gh-release 先按 tag
# 查已有 release(不存在才创建),多 job 并行是安全用法;fail-fast: false
# 保证单平台失败不影响其它平台产物。tag 之外的事件 GITHUB_TOKEN 只读,
# 上传步骤全部有 if 守卫。

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: lume-linux-x64
          - os: ubuntu-24.04-arm
            asset: lume-linux-arm64
          - os: macos-13
            asset: lume-darwin-x64
          - os: macos-14
            asset: lume-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Build lume
        run: make

      - name: Install frontend deps
        run: |
          corepack enable
          cd frontend && pnpm install --frozen-lockfile

      - name: Build frontend bundle
        run: make ui

      - name: Smoke-check all examples
        run: make check

      - name: Report platform and binary type
        run: uname -s -m && file bin/lume

      # The release asset is a tarball, not a bare binary: the web UI bundles
      # (www/*.js) are gitignored build output, so the frontend must ride
      # inside the artifact or an installed binary would serve broken
      # /chat /dsl pages (docroot resolves ./www from the working directory).
      - name: Stage release tarball
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p "dist/${{ matrix.asset }}/bin"
          cp bin/lume "dist/${{ matrix.asset }}/bin/"
          cp -r www examples docs README.md README.zh.md CHANGELOG.md install.sh             "dist/${{ matrix.asset }}/"
          cd dist
          tar -czf "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.*
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.asset }}.tar.gz
