# lume hub 应用（本地 k3s 闭环）。与 invest 同模式：容器内 8083，
# Service NodePort 供平台服务探测直达。host.docker.internal 解析到宿主网关
# 使 LLM 上游 :19070 可达（与 compose 的 extra_hosts 一致）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lume-hub
  labels:
    app: lume-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lume-hub
  template:
    metadata:
      labels:
        app: lume-hub
    spec:
      containers:
        - name: lume-hub
          image: lume:local
          imagePullPolicy: IfNotPresent
          # args 只覆盖 CMD，保留镜像 ENTRYPOINT（entrypoint.sh 负责生成 htpasswd）。
          # 用 command 会把 ENTRYPOINT 一并替换 → entrypoint 不执行 → 找不到
          # /app/auth/htpasswd → lume 启动即退（cannot open htpasswd file）。
          args: ["./bin/lume", "examples/hub.lume"]
          ports:
            - containerPort: 8083
          env:
            # 认证：entrypoint 用 LUME_AUTH_PASSWORD 现场生成 /app/auth/htpasswd。
            # 密码不落库（避免明文进 git）：apply 前先建 Secret——
            #   kubectl create secret generic lume-hub-auth --from-literal=password=<你的密码>
            - name: LUME_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lume-hub-auth
                  key: password
            - name: HTPASSWD_FILE
              value: "/app/auth/htpasswd"
            # LLM 上游：容器坐标 host.docker.internal（实测 k3s Pod 可达宿主）。
            # agent_round 把 LLM_API_URL 直接当 chat/completions 端点用，必须给
            # 全路径；key 走 Secret（sk-tr-… 由 tsm-hub 网关签发，勿明文入 yaml）。
            - name: LLM_API_URL
              value: "http://host.docker.internal:19070/v1/chat/completions"
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lume-hub-llm
                  key: apikey
            - name: LLM_MODEL
              value: "auto"
            - name: ROUTER_API_URL
              value: "http://host.docker.internal:19070/v1"
            # 白名单与 Makefile HUB_* 对齐
            - name: HARNESS_SKILLS_ALLOW
              value: "code-review,rust-review,post-comment,hot-news-post,weekly-investment"
            - name: HARNESS_TOOLS_ALLOW
              value: "calc,echo,fetch_url,get_time,query_exchange_rate,recall,remember,skill-run,system_info"
            - name: MCP_ALLOW
              value: "fs,memory,think"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lume-hub
  labels:
    app: lume-hub
spec:
  type: NodePort
  selector:
    app: lume-hub
  ports:
    - port: 8083
      targetPort: 8083
