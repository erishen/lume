# ============================================================================
# lume —— 单镜像 docker 应用 (compose, 全部自足单镜像)。
#   cd research && docker compose -f lume/docker/docker-compose.yml up
#
# 单镜像 lume:latest, service 各自把 examples/<name>.lume 伺服成
# 独立应用,共用同一棵 docroot(www/,含 invest 聊天 bundle + esbuild 分包
# chunk + Tailwind 壳样式),各自端口 + 技能/工具/MCP 白名单。
#
# 端口(镜像内 DSL 写死,compose 宿主端口错开,均绑 127.0.0.1):
#   service   .lume           容器内    宿主
#   invest    invest.lume     8082      127.0.0.1:18082
#   hub       hub.lume        8083      127.0.0.1:18083
#
# 访问控制:Lume 服务端本身没有鉴权模块,server{} 里 htpasswd 留空即完全
#   无认证 —— /api/reports(投资周报)、/react/api/chat、/discovery 都是
#   裸端点,聊天里还能经 fs 工具读写文件。这里用两层防护:
#   1. 宿主端口绑 127.0.0.1 而非 0.0.0.0 —— 服务不进 LAN,只对宿主机可见。
#   2. Basic Auth —— server{} 里 htpasswd = env("HTPASSWD_FILE"),本文件给
#      容器注 HTPASSWD_FILE=/app/auth/htpasswd。该文件不挂载,由镜像的
#      entrypoint 在容器启动时从 .env 的 LUME_AUTH_PASSWORD 现场生成
#      (见 lume/docker/entrypoint.sh)。实测无凭证 401 +
#      WWW-Authenticate: Basic realm="lume"。
#   密码只有 .env 一个来源,改 .env 后 `docker compose up -d` 即生效。
#   框架只认 $5$/$6$/bcrypt 强哈希,明文与弱哈希加载即失败退出。
#   临时关掉容器认证:把 service 的 HTPASSWD_FILE 和 .env 的
#   LUME_AUTH_PASSWORD 一起删掉(两边留一个就是不一致状态)。
#   本机 make invest 不注这些 env → server{} 取到 null → 认证保持关闭,
#   开发体验不变。
#   注意:框架不豁免 /health,所以认证开启时它返回 401 —— healthcheck 因此
#   同时接受 200 和 401,见 x-lume-common。
#
# LLM 上游:容器内 localhost 是容器自己,不是宿主 —— 用 extra_hosts 把
#   host.docker.internal 指回宿主网关 (LLM_API_URL 由宿主 .env 写
#   http://localhost:19070/v1,compose 重写成容器视角的
#   http://host.docker.internal:19070/v1 —— 与 agent-httpd 同款容器化
#   坐标,见 agent-httpd/docker-compose.yml 的 LLM_API_URL 覆盖注释)。
#
# 技能/工具/MCP:镜像带整棵 skills/(DSL 技能检索树)+ examples/,
#   compose 按示例给 env(与 Makefile 的 <NAME>_SKILLS/TOOLS/MCPS 对齐):
#   - demo/hello   DSL 自带微型工具,不注白名单(默认全开)。
#   - invest       weekly-investment 技能 + 投资工具 + portfolio/pse MCP
#   - hub          code-review / rust-review / hot-news-post 等网关技能
#                  + fs/memory/think + portfolio-check/pse-review
#   (白名单值见 Makefile 顶部 INVEST_* / HUB_* —— compose 这里内联一份
#   镜像内能自给自足的;MCP 服务器走 npx @modelcontextprotocol/*, 而宿主
#   那份 skills/.data 依赖绝对路径 ../harness —— 容器里没有的那几个 MCP
#   (portfolio-check / pse-review 桥到 harness 的技能语料)不炸, 而是 DSL
#   侧按 MCP_ALLOW 白名单决定起不起; 你想在容器里跑完整 invest 周报,
#   把宿主 harness 技能树挂进镜像 (compose 注释里有卷位) 即可 —— 见
#   docs/DEVELOPMENT.md「容器化」一节)。
# ============================================================================

name: lume-stack

x-lume-common: &lume-common
  image: lume:latest
  build:
    context: ..               # lume/(仓库根)—— agent-httpd 是 submodule,
                              # 在仓库内;dockerfile 相对 context 解析
    dockerfile: docker/Dockerfile
  # LLM 上游坐标: 容器内 → host.docker.internal (宿主网关 :19070)。
  # 实际 URL/MODEL/KEY 从项目根 .env 注入 (LLM_API_URL/LLM_MODEL/
  # LLM_API_KEY), compose 只把 localhost 换成容器坐标。
  extra_hosts:
    - "host.docker.internal:host-gateway"
  env_file:
    - path: ../.env            # lume/.env (相对本 compose 文件目录解析; 可选)
      required: false
  environment:
    # 模板里 lume 读 .env(LLM_API_URL 等)。这里是容器坐标覆盖:
    # 宿主 .env 写 localhost:19070, 容器内必须是 host.docker.internal。
    # KEY/MODEL 仍走 .env, 不落镜像。
    LLM_API_URL: "${LLM_API_URL:-http://host.docker.internal:19070/v1}"
    # ROUTER_API_URL 同理:漏覆盖时容器内去连 localhost:19070(容器自己),
    # llm-router 同步静默失败 -> .data/mcp-servers-router.json 不生成 ->
    # /discovery 的 mcps 为空、MCP 服务器(fs/memory/think)全不注册。
    # 同步日志里 base 打的是实际解析值,可据此判断有没有被覆盖。
    ROUTER_API_URL: "${ROUTER_API_URL:-http://host.docker.internal:19070/v1}"
  working_dir: /app
  # htpasswd 不挂载: 由镜像的 entrypoint 在容器内从 .env 的
  # LUME_AUTH_PASSWORD 生成(见 lume/docker/entrypoint.sh)。镜像里既不带
  # 哈希也不带明文 —— 密码只有 .env 这一个来源, 改一处即可。
  healthcheck:
    # lume 自带 /health(与 agent-httpd 同源, 见 ../agent-httpd/src/http/
    # http_route.c), 容器就绪判据与宿主 make dev 的轮询一致。
    # 认证开启时 /health 返回 401 而非 200 —— 401 表示「服务在跑且鉴权
    # 生效」, 同样算健康; 只有连不上或非 200/401 才算不健康。密码不能写进
    # compose 里用(那等于把凭据落库), 所以这里只认状态码。
    # 镜像已无 curl(scratch/busybox), 用 busybox wget -S 打印状态行 +
    # sed 提取码; 必须写 $$c 而不是 $c: compose 渲染时会把裸 $c 当未定义
    # 变量展开成空串 (警告 "The c variable is not set"), 判断退化成假失败。
    test: ["CMD-SHELL", "c=$(/bin/wget -S -q -O /dev/null http://127.0.0.1:${LUME_HEALTH_PORT:-8082}/health 2>&1 | sed -n 's/.*HTTP\\/[^ ]* \\([0-9]\\{3\\}\\).*/\\1/p' | sed -n '1p'); [ \"$$c\" = 200 ] || [ \"$$c\" = 401 ]"]
    interval: 5s
    timeout: 2s
    retries: 20
    start_period: 8s
  restart: unless-stopped

services:
  invest:
    <<: *lume-common
    command: ["./bin/lume", "examples/invest.lume"]
    environment:
      # 服务自己的 environment 会整块替换 x-lume-common 的 environment,
      # 所以锚点里的 LLM_API_URL / ROUTER_API_URL 覆盖必须在这里重复一遍
      # 才生效(实测只写锚点时容器内仍是 .env 的 localhost,router 同步静默失败)。
      LLM_API_URL: "${LLM_API_URL:-http://host.docker.internal:19070/v1}"
      ROUTER_API_URL: "${ROUTER_API_URL:-http://host.docker.internal:19070/v1}"
      # 认证开关: 指向 entrypoint 在容器内生成的 htpasswd。删掉这一行即回到
      # 无认证 —— 与 server{} 里 env("HTPASSWD_FILE") 为 null 时框架禁用
      # 认证的语义一致, 不会误伤本机 make invest 的开发体验。
      HTPASSWD_FILE: "/app/auth/htpasswd"
      # 白名单与 Makefile INVEST_* 对齐(镜像内能自足的技能/工具/MCP;
      # portfolio-check/pse-review 桥 harness 语料, 容器内缺 → 白名单
      # 含也不炸, DSL 按白名单只拉起能在容器里活的)。
      HARNESS_SKILLS_ALLOW: "weekly-investment"
      # 领域工具(portfolio_get/add/remove、report_generate、sql_*)与 Makefile
      # INVEST_TOOLS 对齐 —— 本地 tool 也被 HARNESS_TOOLS_ALLOW 过滤,漏了
      # 会像曾经的 add 一样被静默丢弃(只有一行 stderr)。
      # sql_query/sql_tables/sql_schema 是原生 SQLite 工具(无需 Python):
      # 设置 SQLITE_DB(如 /app/.data/lume.db, 需挂卷或 COPY 入镜像)即启用;
      # 不设置时工具不注册, 白名单条目无害。
      HARNESS_TOOLS_ALLOW: "skill-run,read_file,get_time,query_exchange_rate,fetch_url,recall,remember,portfolio_get,portfolio_add,portfolio_remove,report_generate,sql_query,sql_tables,sql_schema"
      # 保守默认只读;需要模型建分析表时在 HARNESS_TOOLS_ALLOW 加回 sql_write
      MCP_ALLOW: "fs,think,memory"
      # iquest 产品 API(settings/reports)的可写落点: 容器内用 /app 下的
      # 路径, 避免默认值里宿主的绝对路径 (Dockerfile 已建 /app/reports 并
      # 归 lume 用户写)。.env 由设置页在容器内重写, 不进镜像。
      IQUEST_REPORTS_DIR: "/app/reports"
      IQUEST_ENV_FILE: "/app/.env"
    ports:
      - "127.0.0.1:18082:8082"   # 绑回环 + Basic Auth, 见文件头「访问控制」
    healthcheck:
      # 认证开启 → 401 也算健康, 理由见 x-lume-common 的 healthcheck 注释
      test: ["CMD-SHELL", "c=$(/bin/wget -S -q -O /dev/null http://127.0.0.1:8082/health 2>&1 | sed -n 's/.*HTTP\\/[^ ]* \\([0-9]\\{3\\}\\).*/\\1/p' | sed -n '1p'); [ \"$$c\" = 200 ] || [ \"$$c\" = 401 ]"]

  hub:
    <<: *lume-common
    command: ["./bin/lume", "examples/hub.lume"]
    environment:
      # 同 invest:服务级 environment 整块替换锚点, 覆盖必须重复一遍才生效。
      LLM_API_URL: "${LLM_API_URL:-http://host.docker.internal:19070/v1}"
      ROUTER_API_URL: "${ROUTER_API_URL:-http://host.docker.internal:19070/v1}"
      HTPASSWD_FILE: "/app/auth/htpasswd"   # 与 invest 同款, 见上
      HARNESS_SKILLS_ALLOW: "code-review,rust-review,post-comment,hot-news-post,weekly-investment"
      HARNESS_TOOLS_ALLOW: "calc,echo,fetch_url,get_time,query_exchange_rate,recall,remember,skill-run,system_info"
      MCP_ALLOW: "fs,memory,think"
    ports:
      - "127.0.0.1:18083:8083"   # 绑回环 + Basic Auth, 见文件头「访问控制」
    healthcheck:
      # 认证开启 → 401 也算健康, 理由见 x-lume-common 的 healthcheck 注释
      test: ["CMD-SHELL", "c=$(/bin/wget -S -q -O /dev/null http://127.0.0.1:8083/health 2>&1 | sed -n 's/.*HTTP\\/[^ ]* \\([0-9]\\{3\\}\\).*/\\1/p' | sed -n '1p'); [ \"$$c\" = 200 ] || [ \"$$c\" = 401 ]"]

  # ---------------------------------------------------------------------------
  # rea-demo —— 查看 rea（Reverse Engineer Anything 逆向 MCP）接入的演示服务。
  # 专用镜像 docker/rea-demo.Dockerfile（ubuntu:24.04 + node 24 + rea-agents），
  # 与 invest/hub 的 scratch 最小化镜像隔离 —— rea 需要 node 运行时，加进
  # scratch 会把安全面整体扩大, 故独立成镜像。
  #
  # 接入方式（agent-httpd MCP 机制）:
  #   MCP_ALLOW="rea"          —— 白名单放行（compose 的 invest/hub 是
  #                               fs,think,memory, 均不含 rea, 所以只有
  #                               本 service 能看到 rea）
  #   MCP_SERVERS=JSON         —— 注入 MCP 服务器配置（容器内路径）;
  #                               .dockerignore 已排除 .data/, 镜像内没有
  #                               宿主机绝对路径配置, env 是唯一来源
  #   rea 冷启动 40–90s        —— agent-httpd MCP_BOOT_TIMEOUT 已改 120s
  #   rea 默认无目标            —— 先 open_binary 注入目标再分析
  # 访问控制: 与 invest/hub 同款 Basic Auth —— HTPASSWD_FILE 指向镜像
  #   entrypoint 现场生成的 /app/auth/htpasswd（从 .env LUME_AUTH_PASSWORD
  #   生成, $6$ 强哈希; 无密码则不生成 → 认证关闭）。因此 rea-demo 同样
  #   只有 .env 一个凭据来源, 端口绑回环 + 认证双层防护。
  # 端口: 127.0.0.1:18084 → 容器 8082 (rea-demo.lume, Basic Auth)。
  # ---------------------------------------------------------------------------
  rea-demo:
    image: lume-rea-demo:latest
    build:
      context: ..               # lume/(仓库根), 与主镜像同 context
      dockerfile: docker/rea-demo.Dockerfile
    # 独立 build（不用 x-lume-common 锚点）→ 必须显式带 env_file,
    # 否则 .env 的 LLM_API_KEY/LLM_MODEL 不注入, llm-router 同步无认证 → 401,
    # .data/mcp-servers-router.json 不生成 → /discovery 的 mcps 为空。
    env_file:
      - path: ../.env            # lume/.env (可选)
        required: false
    command: ["./bin/lume", "examples/rea-demo.lume"]
    # 开发期挂载宿主 www/examples(只读): 页面与 .lume 热改免重编镜像;
    # 生产再按镜像内 COPY 版本走(rebuild 时带上)。
    volumes:
      - ../www:/app/www:ro
      - ../examples:/app/examples:ro
      # local 配置源: 容器专用文件(仅 rea 条目) 注入容器, 供 catalog().mcps
      # 显示 "local" 来源; agent-httpd 同 id 去重, 与 env MCP_SERVERS 不重复
      # 注册。.data 被 .dockerignore 排除, 镜像无此文件; 不用宿主 .data 全量
      # 配置以免把 invest 的 portfolio-check/pse-review 也带进显示。
      - ../docker/rea-local-mcps.json:/app/.data/mcp-servers.json:ro
    environment:
      # 服务级 environment 整块替换锚点 → LLM/ROUTER 覆盖必须重复（同 invest/hub）
      LLM_API_URL: "${LLM_API_URL:-http://host.docker.internal:19070/v1}"
      ROUTER_API_URL: "${ROUTER_API_URL:-http://host.docker.internal:19070/v1}"
      MCP_ALLOW: "rea"
      MCP_SERVERS: '[{"id":"rea","transport":"stdio","command":"/opt/node/bin/node","args":"/app/rea/node_modules/rea-agents/scripts/rea.mjs mcp","approval":false}]'
      # Basic Auth: 指向 entrypoint 在容器内生成的 htpasswd（.env 的
      # LUME_AUTH_PASSWORD 唯一来源）。与 invest/hub 对齐, 端口绑回环之上
      # 再加一层认证; 删掉这一行即回到无认证（与本机 make 语义一致）。
      HTPASSWD_FILE: "/app/auth/htpasswd"
      # REA 使用引导: 注入聊天系统提示, 避免模型在 170 个工具里裸奔乱试
      # （实测会话教训: open_binary 空响应被误读为错误、inspect_macho 误用于
      # ELF、list_documents/fetch_url/calc 等无关调用兜底）。值与 agent-httpd
      # 的 LLM_SYSTEM_EXTRA 拼接进模型系统提示。
      LLM_SYSTEM_EXTRA: |-
        REA 使用引导（每次分析前必读）:
        1. rea 是逆向 MCP, 先用 open_binary 注入目标; Linux 二进制(如 /bin/ls, ELF)用 provider_id="ghidra"。
        2. open_binary 返回空结果是正常的: Ghidra 异步自动分析, 用 binary_session 查状态, 提示"分析完成前不提供结果"时稍等重试, 不要反复 open_binary 同一文件。
        3. inspect_macho 只用于 Mach-O(macOS 格式); /bin/ls 是 ELF, 不要调用它。
        4. list_documents / analyze_web_bundle / capture_web_* 是 Web 工具, 与本地二进制分析无关, 不要用。
        5. fetch_url 是 HTTP 工具, 不支持 file://; 读本地文件用 read_file。不要请求无关外网。
        6. ELF 调用图/依赖的正确路径: open_binary → binary_session(等分析完成) → binary_overview(格式/架构) → get_call_graph(调用图) → list_names / list_procedures(符号)。
        7. 容器内没有 ldd/readelf: 拿不到 DT_NEEDED 时, 基于调用图与导入符号给出推断, 并明确标注是推断。
        8. 工具异常时先查 binary_session 状态, 不要用 get_time / calc 等无关工具兜底。
    ports:
      - "127.0.0.1:18084:8082"   # 绑回环 + Basic Auth, 见 rea-demo 注释
    healthcheck:
      # 认证开启 → 401 也算健康, 理由同 x-lume-common 的 healthcheck 注释
      test: ["CMD-SHELL", "c=$(/bin/curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/health 2>&1); [ \"$$c\" = 200 ] || [ \"$$c\" = 401 ]"]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # serena-demo —— 查看 Serena（Oraios AI, 源码符号级语义 MCP）接入的演示服务。
  # 与 rea-demo 互补: rea 是二进制逆向(无源码), serena 是 LSP 符号级源码分析
  # (有源码), lume 里并排 = "有源码 / 无源码" 两种函数分析。
  # 专用镜像 docker/serena-demo.Dockerfile（ubuntu:24.04 + python3 + clangd +
  # 本机 serena 源码 pip 安装）, 与 scratch 最小化镜像隔离 —— python 运行时
  # 会扩大安全面, 独立成镜像（同 rea-demo 理由）。
  #
  # 接入方式（agent-httpd MCP 机制）:
  #   MCP_ALLOW="serena"        —— 白名单放行（invest/hub 的 fs,think,memory
  #                                 均不含 serena, 只有本 service 能看到）
  #   MCP_SERVERS=JSON          —— stdio 注入 /usr/local/bin/serena
  #                                start-mcp-server --project /app/projects/lume
  #                                （容器内路径; .dockerignore 排除 .data/,
  #                                镜像内无宿主机绝对路径配置, env 是唯一来源）
  #   SERENA_HOME=/app/.serena  —— config 目录(agent_interface: tools,
  #                                独立工具接口; v2 默认 REPL 单工具)
  #   SERENA_DOCKER=1           —— 容器环境信号
  #   分析目标 /app/projects/lume 只读挂载宿主 lume 仓库根（lang/*.c/h 等,
  #   容器内 clangd 做 C/C++ 符号分析）; 要分析别的代码库, 换挂载 + 改
  #   MCP_SERVERS 的 --project 即可。
  # 访问控制: 与 rea-demo 同款 Basic Auth —— HTPASSWD_FILE 指向镜像 entrypoint
  #   现场生成的 /app/auth/htpasswd（.env LUME_AUTH_PASSWORD 唯一来源）;
  #   端口绑回环 + 认证双层防护。
  # 端口: 127.0.0.1:18085 → 容器 8083 (serena-demo.lume, Basic Auth)。
  # ---------------------------------------------------------------------------
  serena-demo:
    image: lume-serena-demo:latest
    build:
      context: ..               # lume/(仓库根), 与主镜像同 context
      dockerfile: docker/serena-demo.Dockerfile
    # 独立 build（不用 x-lume-common 锚点）→ 必须显式带 env_file,
    # 否则 .env 的 LLM_API_KEY/LLM_MODEL 不注入, llm-router 同步无认证 → 401,
    # .data/mcp-servers-router.json 不生成 → /discovery 的 mcps 为空。
    env_file:
      - path: ../.env            # lume/.env (可选)
        required: false
    command: ["./bin/lume", "examples/serena-demo.lume"]
    # 开发期挂载宿主 www/examples(只读): 页面与 .lume 热改免重编镜像;
    # 生产再按镜像内 COPY 版本走(rebuild 时带上)。
    volumes:
      - ../www:/app/www:ro
      - ../examples:/app/examples:ro
      # local 配置源: 容器专用文件(仅 serena 条目) 注入容器, 供 catalog().mcps
      # 显示 "local" 来源; agent-httpd 同 id 去重, 与 env MCP_SERVERS 不重复
      # 注册。.data 被 .dockerignore 排除, 镜像无此文件。
      - ../docker/serena-local-mcps.json:/app/.data/mcp-servers.json:ro
      # 分析目标: 只挂载 lang/（lume 的 C 语言核心, 36 个 .c/.h）——serena
      # 语言检测只看 C 源码 → 选 clangd。若挂载整个仓库根, www/frontend/
      # editor 的 JS/TS 占检测占比 97%, serena 会选 typescript LS（需 node,
      # 容器未装, LSP 初始化失败 → 符号工具不可用）。只读挂载: serena 只做
      # 语义检索/分析演示, 编辑类工具在只读挂载下会失败 —— 刻意如此, 避免
      # 容器内改动宿主源码; 要演示编辑再换可写挂载。
      - ../lang:/app/projects/lume:ro
    environment:
      # 服务级 environment 整块替换锚点 → LLM/ROUTER 覆盖必须重复（同 invest/hub）
      LLM_API_URL: "${LLM_API_URL:-http://host.docker.internal:19070/v1}"
      ROUTER_API_URL: "${ROUTER_API_URL:-http://host.docker.internal:19070/v1}"
      MCP_ALLOW: "serena"
      MCP_SERVERS: '[{"id":"serena","transport":"stdio","command":"/usr/local/bin/serena","args":"start-mcp-server --project /app/projects/lume --transport stdio","approval":false}]'
      SERENA_HOME: "/app/.serena"
      SERENA_DOCKER: "1"
      # Basic Auth: 指向 entrypoint 在容器内生成的 htpasswd（.env 的
      # LUME_AUTH_PASSWORD 唯一来源）。与 rea-demo 对齐, 端口绑回环之上
      # 再加一层认证; 删掉这一行即回到无认证。
      HTPASSWD_FILE: "/app/auth/htpasswd"
    ports:
      - "127.0.0.1:18085:8083"   # 绑回环 + Basic Auth, 见 serena-demo 注释
    healthcheck:
      # 认证开启 → 401 也算健康, 理由同 x-lume-common 的 healthcheck 注释
      test: ["CMD-SHELL", "c=$(/bin/curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8083/health 2>&1); [ \"$$c\" = 200 ] || [ \"$$c\" = 401 ]"]
    restart: unless-stopped
